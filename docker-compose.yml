
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: redhat
      MYSQL_DATABASE: attendance_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:redhat@db:3306/attendance_db
    volumes:
      - .:/app
    command: >
      bash -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  mysql_data:
