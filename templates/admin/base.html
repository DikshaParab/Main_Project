<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EMS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/admin.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <div class="brand-logo">EMS</div>
      <div class="me-auto">
        <a href="/logout" class="btn btn-warning">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <aside class="sidebar">
      <h5 class="mt-3 text-center">Employee Management</h5><br>
      <a href="/admin/dashboard/{{ user.id }}" class="{% if request.url.path.startswith('/admin/dashboard') %}active{% endif %}">Dashboard</a>
      <a href="/admin/log-history/{{ user.id }}" class="{% if request.url.path.startswith('/admin/log-history') %}active{% endif %}">Log History</a>
      <a href="/admin/leave-requests/{{ user.id }}" class="{% if request.url.path.startswith('/admin/leave-requests') %}active{% endif %}">Leave Requests</a>
      <a href="/admin/add-employee/{{ user.id }}" class="{% if request.url.path.startswith('/admin/add-employee') %}active{% endif %}">Add Employee</a>
      <a href="/admin/profile/{{ user.id }}" class="{% if request.url.path.startswith('/admin/profile') %}active{% endif %}">Profile</a>
    </aside>

    <main class="main-content p-4" style="flex-grow: 1;">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
