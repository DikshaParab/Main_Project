<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EMS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/admin.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <div class="brand-logo text-white">EMS</div>
      <div class="ms-auto">
        <a href="/logout" class="btn btn-warning">
          <i class="fas fa-sign-out-alt me-2"></i>Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <aside class="sidebar">
      <h5 class="mt-3 text-center">Employee Management</h5>
      <a href="/dashboard?employee_id={{ employee.id }}">Dashboard</a>
      <a href="/log-history?employee_id={{ employee.id }}">Log History</a>
      <a href="/leave-requests?employee_id={{ employee.id }}">Leave Requests</a>
      <a href="/add-employee?employee_id={{ employee.id }}">Add Employee</a>
      <a href="/profile?employee_id={{ employee.id }}">Profile</a>
    </aside>

    <main class="main-content p-4" style="flex-grow: 1;">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
