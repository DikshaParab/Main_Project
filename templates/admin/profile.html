<!-- profile.html -->
{% extends "/admin/base.html" %}
{% block content %}
<div class="container mt-4 d-flex justify-content-center">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div class="card-header bg-primary text-white text-center">
      <h4 class="mb-0">Employee Profile</h4>
    </div>
    <div class="card-body">
      <div class="mb-3 text-center">
        <i class="fa fa-user-circle fa-5x text-secondary"></i>
      </div>
      <table class="table table-borderless">
        <tr><th>Name:</th><td>{{ employee.name }}</td></tr>
        <tr><th>Email:</th><td>{{ employee.email }}</td></tr>
        <tr><th>Role:</th><td>{{ 'Admin' if employee.role else 'Employee' }}</td></tr>
        <tr><th>ID:</th><td>{{ employee.id }}</td></tr>
      </table>
    </div>
  </div>
</div>
{% endblock %}
